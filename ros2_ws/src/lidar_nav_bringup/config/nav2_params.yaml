# Nav2 params for the wheel-legged robot: MID-360 -> STVL 3D voxel obstacle layer.
# Planning stays 2D (x, y, yaw); STVL voxelizes the cloud and projects occupied
# voxels (within a height band, in the gravity-aligned global frame) into 2D cost.
#
# Based on the Nav2 (Jazzy) default params; if a key is rejected on your build,
# diff against /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml.
#
# ASSUMED VALUES (see docs/lidar_nav_plan.md "Assumptions") -- tune on the robot:
#   robot_radius, max_vel_x, max_vel_theta, acceleration limits, STVL heights.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25       # ASSUMED: "roughly arrived" is enough
      yaw_goal_tolerance: 0.5
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      wz_std: 0.4
      vx_max: 0.5                   # ASSUMED max forward speed (m/s)
      vx_min: -0.35                 # allow reverse (back off when too close)
      wz_max: 1.0                   # ASSUMED max yaw rate (rad/s)
      iteration_count: 1
      motion_model: "DiffDrive"     # wheel-legged presents as differential drive
      visualize: false
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic", "ObstaclesCritic"]
      ObstaclesCritic:
        cost_weight: 4.0
        repulsion_weight: 1.5
        collision_cost: 100000.0
      GoalCritic: {cost_weight: 5.0}
      PathFollowCritic: {cost_weight: 5.0}

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.40            # ASSUMED: covers the widest wheel-legged stance
      transform_tolerance: 0.3
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 15.0           # seconds a voxel survives without re-observation
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        max_obstacle_height: 2.0
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        obstacle_range: 5.0
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.3
        mapping_mode: false
        observation_sources: livox
        livox:
          data_type: PointCloud2
          topic: /livox/lidar
          marking: true
          clearing: true
          obstacle_range: 5.0
          min_obstacle_height: 0.12   # ASSUMED: above the floor with margin for body pitch
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: true
          clear_after_reading: true
          max_z: 2.0
          min_z: 0.1
          vertical_fov_angle: 1.0297   # MID-360 vertical FOV 59deg (-7..+52)
          horizontal_fov_angle: 6.2832 # 360 deg
          decay_acceleration: 5.0
          model_type: 1                # 1 = 3D LiDAR (spherical frustum clearing)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55        # ASSUMED: robot_radius + clearance

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true            # mapless to start; add static_layer for a saved map
      width: 40
      height: 40
      resolution: 0.05
      robot_radius: 0.40
      transform_tolerance: 0.3
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 60.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        max_obstacle_height: 2.0
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        obstacle_range: 8.0
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.3
        mapping_mode: false
        observation_sources: livox
        livox:
          data_type: PointCloud2
          topic: /livox/lidar
          marking: true
          clearing: true
          obstacle_range: 8.0
          min_obstacle_height: 0.12
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: true
          clear_after_reading: true
          max_z: 2.0
          min_z: 0.1
          vertical_fov_angle: 1.0297
          horizontal_fov_angle: 6.2832
          decay_acceleration: 5.0
          model_type: 1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.35, 0.0, -1.0]
    max_accel: [2.0, 0.0, 3.0]
    max_decel: [-2.0, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
