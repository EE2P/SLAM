# Nav2 params for the RealSense-ONLY fallback (no LiDAR).
#
# Key difference vs the MID-360 stack: the camera sees only a ~87 deg x 58 deg
# forward cone, so:
#   * GLOBAL costmap = RTAB-Map's 2D occupancy grid (/rtabmap/map) via static_layer
#     -- this "remembers" mapped obstacles the camera can no longer see.
#   * LOCAL costmap  = live depth cloud via STVL (3D obstacles within the FOV).
#   * Speeds are lower and pure-spin is risky (blind to the sides) -- drive gently.
#
# Based on the Nav2 (Jazzy) defaults; if a key is rejected, diff against
# /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml.
# ASSUMED values flagged below -- tune on the robot.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      wz_std: 0.4
      vx_max: 0.4                   # ASSUMED, lower than LiDAR: camera is forward-only
      vx_min: -0.3
      wz_max: 0.7                   # ASSUMED, gentle yaw (blind to the sides)
      iteration_count: 1
      motion_model: "DiffDrive"
      visualize: false
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic", "ObstaclesCritic"]
      ObstaclesCritic:
        cost_weight: 4.0
        repulsion_weight: 1.5
        collision_cost: 100000.0
      PreferForwardCritic:
        cost_weight: 6.0            # bias toward driving forward (where it can see)
      GoalCritic: {cost_weight: 5.0}
      PathFollowCritic: {cost_weight: 5.0}

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.40            # ASSUMED: covers the widest wheel-legged stance
      transform_tolerance: 0.3
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 5.0            # short: camera depth is noisier than LiDAR
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        max_obstacle_height: 2.0
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        obstacle_range: 4.0
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.3
        mapping_mode: false
        observation_sources: rs_depth
        rs_depth:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          marking: true
          clearing: true
          obstacle_range: 4.0       # ASSUMED: D455 ~6 m / D435i ~4 m reliable depth
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: true
          clear_after_reading: true
          max_z: 4.0
          min_z: 0.1
          vertical_fov_angle: 1.012   # RealSense depth ~58 deg
          horizontal_fov_angle: 1.518 # ~87 deg
          decay_acceleration: 5.0
          model_type: 0               # 0 = depth camera (planar frustum clearing)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true
      robot_radius: 0.40
      resolution: 0.05
      transform_tolerance: 0.3
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /rtabmap/map       # RTAB-Map's 2D occupancy grid (latched)
        subscribe_to_updates: true
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 0.7]
    min_velocity: [-0.3, 0.0, -0.7]
    max_accel: [2.0, 0.0, 3.0]
    max_decel: [-2.0, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
