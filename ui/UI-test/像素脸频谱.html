<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素脸 · 音频频谱</title>
<style>
  :root{
    /* 频谱配色 黄→绿→蓝 */
    --eq-yellow: 236, 210, 74;
    --eq-green:  95, 191, 90;
    --eq-blue:   79, 150, 217;

    /* 眼睛配色（发光的冷白） */
    --eye:      222, 234, 248;
    --eye-glow: 150, 200, 255;

    /* 眼睛像素几何 */
    --px:   clamp(9px, 2.4vw, 13px);
    --pgap: clamp(3px, 0.9vw, 5px);

    /* 频谱几何 */
    --bar-w:   clamp(7px, 1.9vw, 13px);
    --bar-gap: clamp(4px, 1.2vw, 7px);
    --bar-max: clamp(90px, 26vh, 200px);
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }

  body{
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; user-select:none;
    background:radial-gradient(120% 100% at 50% 42%, #14161c 0%, #0a0b0f 55%, #050506 100%);
  }

  /* 整张脸：眼在上，频谱(嘴)在下并下移 */
  .face{ display:flex; flex-direction:column; align-items:center;
         gap:clamp(34px, 7vh, 64px); }

  .eyes{ display:flex; gap:clamp(30px, 8vw, 52px); }
  .eye{ display:grid; gap:var(--pgap); }
  .px{
    width:var(--px); height:var(--px);
    border-radius:3px;
    background:rgb(var(--eye));
    box-shadow:0 0 8px rgba(var(--eye-glow), .55);
    will-change:opacity;
  }

  .eq{ display:flex; align-items:center; gap:var(--bar-gap); height:var(--bar-max); }
  .bar{ width:var(--bar-w); height:10px; border-radius:calc(var(--bar-w)/2); will-change:height; }

  .hint{
    position:fixed; bottom:32px; left:0; right:0; text-align:center;
    font-size:13px; font-weight:500; letter-spacing:.4px;
    color:rgba(255,255,255,.42); transition:opacity .4s ease;
  }
  .playing .hint{ opacity:0; }
</style>
</head>

  <div class="face">
    <div class="eyes">
      <div class="eye" id="eyeL"></div>
      <div class="eye" id="eyeR"></div>
    </div>
    <div class="eq" id="eq"></div>
  </div>
  <div class="hint" id="hint">轻点任意处播放</div>

    // ===== 频谱参数 =====
    const NUM_BARS = 15;
    const MIN_FRAC = 0.05;
    const ATTACK   = 0.55, RELEASE = 0.10;
    const AGC_DECAY = 0.99, AGC_FLOOR = 0.08;

    // ===== 眼睛参数 =====
    const COLS = 6, ROWS = 8;
    const OPEN_O = 1.08;     // 睁开程度（>1 让边缘像素也亮满）
    const CLOSED_O = 0.20;   // 闭合时只留中间一条线
    const EDGE = 0.18;       // 眼睑边缘柔和度
    const CLOSE_MS = 110, HOLD_MS = 40, OPEN_MS = 140;

    const stage = document.getElementById("stage");
    const eqEl  = document.getElementById("eq");
    const hintEl= document.getElementById("hint");
    const audio = document.getElementById("audio");
    audio.src = AUDIO_SRC; audio.loop = true;

    const css = getComputedStyle(document.documentElement);
    const clamp01 = x => x<0?0:(x>1?1:x);

    // ---- 频谱颜色插值 ----
    const rgbVar = n => css.getPropertyValue(n).split(",").map(s=>parseFloat(s));
    const C_Y=rgbVar("--eq-yellow"), C_G=rgbVar("--eq-green"), C_B=rgbVar("--eq-blue");
    const lerp=(a,b,t)=>a+(b-a)*t;
    const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
    const colorAt=t=>(t<0.5?lerp3(C_Y,C_G,t/0.5):lerp3(C_G,C_B,(t-0.5)/0.5)).map(Math.round);

    // ================= 构建眼睛 =================
    // 角落像素关闭 → 圆角矩形轮廓
    function cornerOff(c,r){
      const ce=Math.min(c, COLS-1-c), re=Math.min(r, ROWS-1-r);
      return ce===0 && re===0;
    }
    const rowCenter=(ROWS-1)/2;
    const eyePx=[];   // {el, d}
    function buildEye(host){
      host.style.gridTemplateColumns = `repeat(${COLS}, var(--px))`;
      for(let i=0;i<COLS*ROWS;i++){
        const c=i%COLS, r=Math.floor(i/COLS);
        const cell=document.createElement("div");
        cell.className="px";
        host.appendChild(cell);
        if(cornerOff(c,r)){ cell.style.opacity="0"; continue; }   // 静态关闭，不参与眨眼
        const d=Math.abs(r-rowCenter)/rowCenter;
        eyePx.push({el:cell, d});
      }
    }
    buildEye(document.getElementById("eyeL"));
    buildEye(document.getElementById("eyeR"));

    // 眨眼调度
    let nextBlink = performance.now() + 1200;
    let blinking=false, blinkStart=0;
    const easeIO = t => t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

    function updateEyes(t){
      let closed=0;
      if(!blinking && t>=nextBlink){ blinking=true; blinkStart=t; }
      if(blinking){
        const e=t-blinkStart;
        if(e<CLOSE_MS)               closed=easeIO(e/CLOSE_MS);
        else if(e<CLOSE_MS+HOLD_MS)  closed=1;
        else if(e<CLOSE_MS+HOLD_MS+OPEN_MS) closed=1-easeIO((e-CLOSE_MS-HOLD_MS)/OPEN_MS);
        else{
          blinking=false; closed=0;
          const dbl=Math.random()<0.18;                 // 偶尔连眨
          nextBlink = t + (dbl ? 150 : 2200+Math.random()*3200);
        }
      }
      const o = OPEN_O + (CLOSED_O-OPEN_O)*closed;
      for(const p of eyePx){
        p.el.style.opacity = clamp01((o - p.d)/EDGE + 0.5).toFixed(3);
      }
    }

    // ================= 构建频谱 =================
    const bars=[]; const heights=new Array(NUM_BARS).fill(MIN_FRAC);
    for(let i=0;i<NUM_BARS;i++){
      const b=document.createElement("div"); b.className="bar";
      const t = NUM_BARS>1 ? i/(NUM_BARS-1) : 0;
      const [r,g,bl]=colorAt(t);
      b.style.background=`rgb(${r},${g},${bl})`;
      b.style.boxShadow=`0 0 12px rgba(${r},${g},${bl},0.4)`;
      eqEl.appendChild(b); bars.push(b);
    }
    function barMaxPx(){ return parseFloat(getComputedStyle(eqEl).height)||160; }

    // ================= 音频 =================
    let audioCtx=null, analyser=null, src=null, freq=null, ready=false, playing=false;
    function setupAudio(){
      if(ready) return;
      const AC=window.AudioContext||window.webkitAudioContext;
      audioCtx=new AC();
      src=audioCtx.createMediaElementSource(audio);
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256; analyser.smoothingTimeConstant=0.7;
      src.connect(analyser); analyser.connect(audioCtx.destination);
      freq=new Uint8Array(analyser.frequencyBinCount); ready=true;
    }
    const MIN_BIN=2, MAX_BIN=110;
    let agcRef=AGC_FLOOR;
    function targetsFromAudio(){
      analyser.getByteFrequencyData(freq);
      const raw=new Array(NUM_BARS); let fmax=0;
      for(let i=0;i<NUM_BARS;i++){
        const lo=Math.floor(MIN_BIN*Math.pow(MAX_BIN/MIN_BIN,i/NUM_BARS));
        let hi=Math.floor(MIN_BIN*Math.pow(MAX_BIN/MIN_BIN,(i+1)/NUM_BARS));
        if(hi<=lo) hi=lo+1;
        let sum=0,n=0; for(let b=lo;b<hi;b++){ sum+=freq[b]; n++; }
        let v=(n?sum/n:0)/255;
        v=v*(1+(i/NUM_BARS)*1.7);
        raw[i]=v; if(v>fmax) fmax=v;
      }
      agcRef=Math.max(fmax, agcRef*AGC_DECAY, AGC_FLOOR);
      const out=new Array(NUM_BARS);
      for(let i=0;i<NUM_BARS;i++) out[i]=MIN_FRAC+(1-MIN_FRAC)*Math.min(1, raw[i]/agcRef);
      return out;
    }
    function targetsIdle(t){
      const out=new Array(NUM_BARS);
      for(let i=0;i<NUM_BARS;i++) out[i]=MIN_FRAC+0.07*(0.5+0.5*Math.sin(t/600+i*0.55));
      return out;
    }

    // ================= 主循环 =================
    function frame(){
      const t=performance.now();
      updateEyes(t);
      const max=barMaxPx();
      const targets=(playing&&ready)?targetsFromAudio():targetsIdle(t);
      for(let i=0;i<NUM_BARS;i++){
        const coef=targets[i]>heights[i]?ATTACK:RELEASE;
        heights[i]+=(targets[i]-heights[i])*coef;
        bars[i].style.height=(heights[i]*max).toFixed(2)+"px";
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ================= 播放/暂停 =================
    async function toggle(){
      setupAudio();
      if(audioCtx.state==="suspended") await audioCtx.resume();
      if(audio.paused){ try{ await audio.play(); playing=true; }catch(e){ playing=false; } }
      else { audio.pause(); playing=false; }
      stage.classList.toggle("playing", playing);
    }
    stage.addEventListener("click",toggle);
    stage.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); }});
    audio.addEventListener("pause",()=>{ playing=false; stage.classList.remove("playing"); });
    audio.addEventListener("play", ()=>{ playing=true;  stage.classList.add("playing"); });
  })();
  </script>
</body>
</html>
